[package]
name = "granaflow"
version = "0.1.0"
edition = "2021"
description = "GranaFlow - gerenciador financeiro pessoal local-first em Rust"
license = "MIT"

[dependencies]
eframe = "0.29"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
rfd = "0.15"

[profile.release]
opt-level = 2
strip = true
